<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Google Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="top-nav" aria-label="Search options">
            <a href="image.html">Images</a>
            <a href="advanced.html">Advanced Search</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        </nav>

        <main class="home">
            <h1 class="wordmark" aria-label="Google">
                <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
            </h1>
            <form action="https://www.google.com/search" method="get">
                <label class="visually-hidden" for="query">Search</label>
                <input class="search-box" id="query" type="text" name="q" autocomplete="off" autofocus>
                <div class="search-buttons">
                    <input class="button" type="submit" value="Google Search">
                    <input class="button" type="submit" name="btnI" value="I'm Feeling Lucky">
                </div>
            </form>
        </main>
        <footer class="ai-credit">Made by AI - Copilot  </footer>
        <script src="theme.js"></script>
    </body>
</html>
