<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Google Image Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="top-nav" aria-label="Search options">
            <a href="index.html">Google Search</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        </nav>

        <main class="home">
            <h1 class="wordmark image-wordmark" aria-label="Google Images">
                <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span><span class="image-label">Images</span>
            </h1>
            <form action="https://www.google.com/search" method="get">
                <label class="visually-hidden" for="image-query">Search images</label>
                <input class="search-box" id="image-query" type="text" name="q" autocomplete="off" autofocus>
                <input type="hidden" name="tbm" value="isch">
                <div class="search-buttons">
                    <input class="button" type="submit" value="Google Search">
                </div>
            </form>
        </main>
        <script src="theme.js"></script>
    </body>
</html>
