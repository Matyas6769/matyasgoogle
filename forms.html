<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Form Elements</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="top-nav" aria-label="Main navigation">
            <a href="index.html">Google Search</a>
            <a href="image.html">Images</a>
            <a href="advanced.html">Advanced Search</a>
            <a href="https://github.com/Matyas6769/googlesearch/blob/main/citace.md">Citations</a>
        </nav>

        <main class="forms-main">
            <h1>Form Elements</h1>
            <p class="forms-intro">A showcase of common HTML form controls and input types.</p>

            <form class="forms-panel" action="#" method="get">
                <input type="hidden" name="demo-token" value="example-only">
                <h2>Personal details</h2>
                <div class="form-grid">
                    <div class="form-field">
                        <label for="full-name">Full name</label>
                        <input id="full-name" name="full-name" type="text" placeholder="Alex Autumn" autocomplete="name">
                    </div>
                    <div class="form-field">
                        <label for="email">Email address</label>
                        <input id="email" name="email" type="email" placeholder="alex@example.com" autocomplete="email">
                    </div>
                    <div class="form-field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" placeholder="Enter a password" autocomplete="new-password">
                    </div>
                    <div class="form-field">
                        <label for="phone">Telephone</label>
                        <input id="phone" name="phone" type="tel" placeholder="+1 555 0100" autocomplete="tel">
                    </div>
                    <div class="form-field">
                        <label for="website">Website</label>
                        <input id="website" name="website" type="url" placeholder="https://example.com">
                    </div>
                    <div class="form-field">
                        <label for="search-example">Search</label>
                        <input id="search-example" name="search" type="search" placeholder="Search this demo">
                    </div>
                </div>

                <h2>Preferences and dates</h2>
                <div class="form-grid">
                    <div class="form-field">
                        <label for="quantity">Quantity</label>
                        <input id="quantity" name="quantity" type="number" min="0" max="100" step="1" value="2">
                    </div>
                    <div class="form-field">
                        <label for="volume">Volume</label>
                        <output id="volume-output" for="volume">60%</output>
                        <input id="volume" name="volume" type="range" min="0" max="100" value="60">
                    </div>
                    <div class="form-field">
                        <label for="birthday">Date</label>
                        <input id="birthday" name="birthday" type="date">
                    </div>
                    <div class="form-field">
                        <label for="meeting">Date and time</label>
                        <input id="meeting" name="meeting" type="datetime-local">
                    </div>
                    <div class="form-field">
                        <label for="month">Month</label>
                        <input id="month" name="month" type="month">
                    </div>
                    <div class="form-field">
                        <label for="week">Week</label>
                        <input id="week" name="week" type="week">
                    </div>
                    <div class="form-field">
                        <label for="time">Time</label>
                        <input id="time" name="time" type="time">
                    </div>
                    <div class="form-field">
                        <label for="favorite-color">Favorite color</label>
                        <input id="favorite-color" name="favorite-color" type="color" value="#b85d36">
                    </div>
                    <div class="form-field">
                        <label for="avatar">Upload a file</label>
                        <input id="avatar" name="avatar" type="file" accept="image/*">
                    </div>
                    <div class="form-field">
                        <label for="browser">Choose a browser</label>
                        <input id="browser" name="browser" type="text" list="browsers" placeholder="Select or type">
                        <datalist id="browsers">
                            <option value="Firefox">
                            <option value="Chrome">
                            <option value="Safari">
                            <option value="Edge">
                        </datalist>
                    </div>
                    <div class="form-field">
                        <label for="country">Country</label>
                        <select id="country" name="country">
                            <option value="">Choose a country</option>
                            <optgroup label="Europe">
                                <option value="cz">Czechia</option>
                                <option value="fr">France</option>
                            </optgroup>
                            <optgroup label="North America">
                                <option value="ca">Canada</option>
                                <option value="us">United States</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="interests">Interests (select multiple)</label>
                        <select id="interests" name="interests" multiple size="3">
                            <option>Design</option>
                            <option>Photography</option>
                            <option>Travel</option>
                            <option>Technology</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-field">
                        <fieldset>
                            <legend>Preferred contact</legend>
                            <div class="choice-list">
                                <label><input type="radio" name="contact" value="email" checked> Email</label>
                                <label><input type="radio" name="contact" value="phone"> Phone</label>
                                <label><input type="radio" name="contact" value="mail"> Mail</label>
                            </div>
                        </fieldset>
                    </div>
                    <div class="form-field">
                        <fieldset>
                            <legend>Topics</legend>
                            <div class="choice-list">
                                <label><input type="checkbox" name="topics" value="news"> News</label>
                                <label><input type="checkbox" name="topics" value="offers"> Offers</label>
                                <label><input type="checkbox" name="topics" value="events"> Events</label>
                            </div>
                        </fieldset>
                    </div>
                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Write your message here"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="primary-action" type="submit" disabled>Submit form</button>
                    <button type="reset">Reset fields</button>
                    <button type="button">Regular button</button>
                    <input type="button" value="Input button">
                    <input type="submit" value="Input submit" disabled>
                    <input type="reset" value="Input reset">
                    <input type="image" src="autumn-wallpaper.png" alt="Image submit example" disabled>
                </div>
                <p class="form-note">This page is a visual demonstration. Submit controls are disabled, so your entries are not sent.</p>
            </form>
        </main>

        <nav class="validator-links" aria-label="Validators">
            <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fmatyas6769.github.io%2Fmatyasgoogle%2Fforms.html" aria-label="Validate HTML">
                <img src="https://www.w3.org/Icons/valid-html401" alt="">
            </a>
            <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fmatyas6769.github.io%2Fmatyasgoogle%2Fstyle.css" aria-label="Validate CSS">
                <img src="https://jigsaw.w3.org/css-validator/images/vcss" alt="">
            </a>
        </nav>
    </body>
</html>
