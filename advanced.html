<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Google Advanced Search</title>
        <link rel="stylesheet" href="style.css?v=2">
    </head>
    <body>
        <nav class="top-nav" aria-label="Search options">
            <a href="index.html">Google Search</a>
            <a href="image.html">Images</a>
            <a href="forms.html">Forms</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        </nav>

        <header class="advanced-header">
            <h1>Advanced Search</h1>
        </header>
        <main class="advanced-main">
            <h2>Find pages containing…</h2>
            <form action="https://www.google.com/search" method="get">
                <div class="advanced-row">
                    <label for="all-words">all these words:</label>
                    <input id="all-words" type="text" name="as_q">
                </div>
                <div class="advanced-row">
                    <label for="exact-phrase">this exact word or phrase:</label>
                    <input id="exact-phrase" type="text" name="as_epq">
                </div>
                <div class="advanced-row">
                    <label for="any-words">any of these words:</label>
                    <input id="any-words" type="text" name="as_oq">
                </div>
                <div class="advanced-row">
                    <label for="none-words">none of these words:</label>
                    <input id="none-words" type="text" name="as_eq">
                </div>
                <div class="advanced-submit">
                    <input type="submit" value="Advanced Search">
                </div>
            </form>
        </main>
        <footer class="site-footer">
            <div class="footer-links">
                <a href="https://github.com/Matyas6769/matyasgoogle/blob/main/citace.md">Citations and sources</a>
                <a href="https://matyas6769.github.io/">Portfolio</a>
            </div>
            <nav class="validator-links" aria-label="Validators">
                <a id="html-validator" href="https://validator.w3.org/nu/" aria-label="Validate HTML">
                    <img src="https://www.w3.org/Icons/valid-html401" alt="">
                </a>
                <a id="css-validator" href="https://jigsaw.w3.org/css-validator/" aria-label="Validate CSS">
                    <img src="https://jigsaw.w3.org/css-validator/images/vcss" alt="">
                </a>
            </nav>
        </footer>
        <script src="validators.js"></script>
        <script src="theme.js"></script>
    </body>
</html>
